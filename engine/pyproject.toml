[project]
name = "plumbline"
version = "0.1.0"
description = "Plumbline inference engine: joint inference over fault and probe placement, plus the FastAPI wrapper."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plumbline", "plumbline_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: experiment smoke tests"]

[tool.pyright]
include = ["plumbline", "plumbline_api"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["plumbline", "plumbline_api"]
