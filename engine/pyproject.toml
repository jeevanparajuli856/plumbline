[project]
name = "truehand"
version = "0.1.0"
description = "Truehand inference engine: joint inference over fault and probe placement, plus the FastAPI wrapper."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0,<1",
    "httpx>=0.28.1,<1",
    "numpy>=2.5.4,<3",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "uvicorn[standard]>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["truehand", "truehand_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: experiment smoke tests"]

[tool.pyright]
include = ["truehand", "truehand_api"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["truehand", "truehand_api"]
