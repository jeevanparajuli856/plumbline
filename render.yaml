# Render Blueprint: static web + Python API. Validate with the Render plugin's render.yaml hook.
services:
  - type: web
    name: plumbline-api
    runtime: python
    plan: free # switch to starter for the semifinal review window and finals week (cold starts)
    rootDir: engine
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn truehand_api.main:app --host 0.0.0.0 --port $PORT --limit-concurrency 64
    healthCheckPath: /v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: TRUEHAND_CORS_ORIGINS
        value: https://plumbline-web-lxxc.onrender.com,http://localhost:5173
  - type: web
    name: plumbline-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
      - key: VITE_API_URL
        value: https://plumbline-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Permissions-Policy
        value: microphone=(self)
