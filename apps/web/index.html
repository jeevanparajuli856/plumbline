<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Truehand: an assistant for blind hands that cannot tell you something it has not measured." />
    <meta name="theme-color" content="#15120F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F3EDE3" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>Truehand</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Truehand" />
    <meta property="og:title" content="Truehand: measurement you can trust without looking" />
    <meta property="og:description" content="A braille cell and a breadboard are the same shape. Truehand works out which hole your probe actually found, and refuses to guess when the physics cannot tell two faults apart." />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Truehand mark, a six-dot braille cell with one dot circled in red, beside the line Measurement you can trust without looking." />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Theme pre-script: apply the saved theme before CSS paints to avoid a flash.
      try {
        var t = localStorage.getItem('plumbline.theme')
        if (t === 'dark' || t === 'light' || t === 'hc') document.documentElement.dataset.theme = t
      } catch (e) {
        /* storage unavailable: follow the OS */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
